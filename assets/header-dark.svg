<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 430" width="1280" height="430" role="img" aria-label="Terminal window: PascalAI at Ingenious Digital — websites, shopify, wordpress, CRM, automations, AI agents, MCP servers, LLM research, CUDA kernels, firmware, games, 3D real-time, VPN and infra, data pipelines, lead gen">
  <title>PascalAI / Ingenious Digital — we build all of it</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="60%" stop-color="#0B1728"/>
      <stop offset="100%" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#47D7FF" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#47D7FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="0" y="0" width="1280" height="430" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="430" fill="url(#field)"/>
    <rect width="1280" height="430" fill="url(#glow)"/>

    <!-- window chrome -->
    <rect width="1280" height="48" fill="#0D1B2E"/>
    <line x1="0" y1="48" x2="1280" y2="48" stroke="#1A2C45"/>
    <circle cx="28" cy="24" r="6.5" fill="#FF5F57"/>
    <circle cx="52" cy="24" r="6.5" fill="#F2B84B"/>
    <circle cx="76" cy="24" r="6.5" fill="#3FCF8E"/>
    <text x="640" y="29" text-anchor="middle" font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace"
          font-size="13" fill="#6F829C" letter-spacing="0.6">pascal@ingenious-digital: ~/dev — 132×34</text>

    <!-- $ whoami -->
    <g font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="15" letter-spacing="0.4">
      <text x="40" y="98">
        <tspan fill="#3FCF8E">pascal@igd</tspan><tspan fill="#6F829C">:</tspan><tspan fill="#47D7FF">~</tspan><tspan fill="#6F829C">$ </tspan><tspan fill="#D9E5F5">whoami</tspan>
      </text>
    </g>

    <text x="38" y="172" font-family="'Segoe UI','Segoe UI Semibold',Inter,'Helvetica Neue',Arial,sans-serif"
          font-size="66" font-weight="700" letter-spacing="-1.5" fill="#D9E5F5">Pascal<tspan fill="#47D7FF">AI</tspan><tspan fill="#6F829C" font-size="26" font-weight="400" letter-spacing="0"> // Ingenious Digital</tspan></text>
    <text x="42" y="206" font-family="'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#6F829C">Fort Lauderdale product studio · fractional CTO, custom software, AI &amp; automation · shipping worldwide</text>

    <!-- $ ls -->
    <g font-family="'Cascadia Mono',Consolas,'SF Mono',Menlo,monospace" font-size="15" letter-spacing="0.4">
      <text x="40" y="258">
        <tspan fill="#3FCF8E">pascal@igd</tspan><tspan fill="#6F829C">:</tspan><tspan fill="#47D7FF">~</tspan><tspan fill="#6F829C">$ </tspan><tspan fill="#D9E5F5">ls what-we-actually-ship/</tspan>
      </text>

      <g font-size="15.5">
        <g fill="#47D7FF" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.5s" fill="freeze"/>
          <text x="56" y="296">websites/</text>
          <text x="284" y="296">shopify/</text>
          <text x="512" y="296">wordpress/</text>
          <text x="740" y="296">crm-systems/</text>
          <text x="968" y="296">automations/</text>
        </g>
        <g fill="#F2B84B" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.85s" fill="freeze"/>
          <text x="56" y="328">ai-agents/</text>
          <text x="284" y="328">mcp-servers/</text>
          <text x="512" y="328">llm-research/</text>
          <text x="740" y="328">cuda-kernels/</text>
          <text x="968" y="328">firmware/</text>
        </g>
        <g fill="#3FCF8E" opacity="0">
          <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.2s" fill="freeze"/>
          <text x="56" y="360">games/</text>
          <text x="284" y="360">3d-realtime/</text>
          <text x="512" y="360">vpn-and-infra/</text>
          <text x="740" y="360">data-pipelines/</text>
          <text x="968" y="360">lead-gen/</text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.7s" fill="freeze"/>
        <text x="40" y="400">
          <tspan fill="#3FCF8E">pascal@igd</tspan><tspan fill="#6F829C">:</tspan><tspan fill="#47D7FF">~</tspan><tspan fill="#6F829C">$ </tspan><tspan fill="#6F829C" font-style="italic"># yes, all of it. the receipts are below.</tspan>
        </text>
        <rect x="566" y="386" width="10" height="19" fill="#47D7FF">
          <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite" calcMode="discrete"/>
        </rect>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="429" rx="14" fill="none" stroke="#1A2C45"/>
</svg>
